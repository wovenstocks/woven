name: Bug report
description: Report a reproducible defect in the interface, contracts, tests, or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose security vulnerabilities here. Use the private process in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its user or developer impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence that reproduces the issue.
      placeholder: |
        1. Start from...
        2. Perform...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, route or contract, browser or Foundry version, network, and wallet when relevant. Never include secrets.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add minimal logs, transaction hashes, or screenshots after removing secrets and personal data.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report does not disclose a security vulnerability or secret.
          required: true
